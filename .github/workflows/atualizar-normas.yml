name: Atualizar Normas do CFM

on:
  schedule:
    # Executa todo domingo às 04:00 UTC (01:00 BRT)
    - cron: '0 4 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar Dependências
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar Coleta Incremental (Ano Atual)
        run: |
          python main.py --ano 2026 --tipos R P E

      - name: Commit e Push das Atualizações
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add normas/ catalogo.json catalogo_ia_privacidade.json manifesto.json PROGRESSO.md estatisticas.html docs/assets/dashboard.svg
          if git diff --staged --quiet; then
            echo "Nenhuma norma nova encontrada nesta execução."
          else
            git commit -m "chore(auto): atualizar acervo de normas CFM [skip ci]"
            git push
          fi
