    <text x="18" y="26" class="section-title">Publicações por Ano (2020–2026)</text>
    <line x1="18" y1="188" x2="400" y2="188" stroke="#334155" stroke-width="1" stroke-dasharray="3 3" />
  </g>
  <rect x="55" y="285" width="32" height="75" rx="4" fill="url(#blueGrad)" /> <text x="71.0" y="279" text-anchor="middle" font-size="11" font-weight="600" fill="#38bdf8">42</text> <text x="71.0" y="378" text-anchor="middle" font-size="11" fill="#94a3b8">2020</text> <rect x="107" y="306" width="32" height="54" rx="4" fill="url(#blueGrad)" /> <text x="123.0" y="300" text-anchor="middle" font-size="11" font-weight="600" fill="#38bdf8">30</text> <text x="123.0" y="378" text-anchor="middle" font-size="11" fill="#94a3b8">2021</text> <rect x="159" y="299" width="32" height="61" rx="4" fill="url(#blueGrad)" /> <text x="175.0" y="293" text-anchor="middle" font-size="11" font-weight="600" fill="#38bdf8">34</text> <text x="175.0" y="378" text-anchor="middle" font-size="11" fill="#94a3b8">2022</text> <rect x="211" y="265" width="32" height="95" rx="4" fill="url(#blueGrad)" /> <text x="227.0" y="259" text-anchor="middle" font-size="11" font-weight="600" fill="#38bdf8">53</text> <text x="227.0" y="378" text-anchor="middle" font-size="11" fill="#94a3b8">2023</text> <rect x="263" y="230" width="32" height="130" rx="4" fill="url(#blueGrad)" /> <text x="279.0" y="224" text-anchor="middle" font-size="11" font-weight="600" fill="#38bdf8">72</text> <text x="279.0" y="378" text-anchor="middle" font-size="11" fill="#94a3b8">2024</text> <rect x="315" y="263" width="32" height="97" rx="4" fill="url(#blueGrad)" /> <text x="331.0" y="257" text-anchor="middle" font-size="11" font-weight="600" fill="#38bdf8">54</text> <text x="331.0" y="378" text-anchor="middle" font-size="11" fill="#94a3b8">2025</text> <rect x="367" y="277" width="32" height="83" rx="4" fill="url(#blueGrad)" /> <text x="383.0" y="271" text-anchor="middle" font-size="11" font-weight="600" fill="#38bdf8">46</text> <text x="383.0" y="378" text-anchor="middle" font-size="11" fill="#94a3b8">2026</text>

  <!-- Painel Direito: Macro-Temas -->
  <g transform="translate(470, 172)">
    <rect x="0" y="0" width="380" height="218" rx="8" fill="#111c30" stroke="#1e293b" stroke-width="1" />
    <text x="18" y="26" class="section-title">Distribuição por Macro-Tema</text>
  </g>
  <text x="490" y="241" font-size="11" fill="#cbd5e1" font-weight="500">Ética Médica/Deontologia</text> <rect x="650" y="231" width="210" height="12" rx="3" fill="#1e293b" /> <rect x="650" y="231" width="210" height="12" rx="3" fill="url(#emeraldGrad)" /> <text x="870" y="241" font-size="11" fill="#10b981" font-weight="600">209</text> <text x="490" y="267" font-size="11" fill="#cbd5e1" font-weight="500">Gestão, Infraestrutura/Perícia</text> <rect x="650" y="257" width="210" height="12" rx="3" fill="#1e293b" /> <rect x="650" y="257" width="63" height="12" rx="3" fill="url(#emeraldGrad)" /> <text x="870" y="267" font-size="11" fill="#10b981" font-weight="600">63</text> <text x="490" y="293" font-size="11" fill="#cbd5e1" font-weight="500">Saúde Digital/Tecnologia</text> <rect x="650" y="283" width="210" height="12" rx="3" fill="#1e293b" /> <rect x="650" y="283" width="28" height="12" rx="3" fill="url(#emeraldGrad)" /> <text x="870" y="293" font-size="11" fill="#10b981" font-weight="600">28</text> <text x="490" y="319" font-size="11" fill="#cbd5e1" font-weight="500">Formação/Registro Prof.</text> <rect x="650" y="309" width="210" height="12" rx="3" fill="#1e293b" /> <rect x="650" y="309" width="23" height="12" rx="3" fill="url(#emeraldGrad)" /> <text x="870" y="319" font-size="11" fill="#10b981" font-weight="600">23</text> <text x="490" y="345" font-size="11" fill="#cbd5e1" font-weight="500">Prática Clínica/Procedimentos</text> <rect x="650" y="335" width="210" height="12" rx="3" fill="#1e293b" /> <rect x="650" y="335" width="8" height="12" rx="3" fill="url(#emeraldGrad)" /> <text x="870" y="345" font-size="11" fill="#10b981" font-weight="600">8</text>

  <!-- Rodapé -->
  <g transform="translate(30, 412)">
    <text x="0" y="0" font-size="10" fill="#64748b">⚡ Automação semanal contínua via GitHub Actions • Licença Pública CC-BY 4.0 • md-augustolinhares/cfm-normas</text>
