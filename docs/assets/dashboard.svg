  <rect x="55" y="370" width="32" height="0" rx="4" fill="url(#blueGrad)" /> <text x="71.0" y="364" text-anchor="middle" font-size="11" font-weight="600" fill="#38bdf8">0</text> <text x="71.0" y="388" text-anchor="middle" font-size="11" fill="#94a3b8">2020</text> <rect x="107" y="370" width="32" height="0" rx="4" fill="url(#blueGrad)" /> <text x="123.0" y="364" text-anchor="middle" font-size="11" font-weight="600" fill="#38bdf8">0</text> <text x="123.0" y="388" text-anchor="middle" font-size="11" fill="#94a3b8">2021</text> <rect x="159" y="370" width="32" height="0" rx="4" fill="url(#blueGrad)" /> <text x="175.0" y="364" text-anchor="middle" font-size="11" font-weight="600" fill="#38bdf8">0</text> <text x="175.0" y="388" text-anchor="middle" font-size="11" fill="#94a3b8">2022</text> <rect x="211" y="370" width="32" height="0" rx="4" fill="url(#blueGrad)" /> <text x="227.0" y="364" text-anchor="middle" font-size="11" font-weight="600" fill="#38bdf8">0</text> <text x="227.0" y="388" text-anchor="middle" font-size="11" fill="#94a3b8">2023</text> <rect x="263" y="370" width="32" height="0" rx="4" fill="url(#blueGrad)" /> <text x="279.0" y="364" text-anchor="middle" font-size="11" font-weight="600" fill="#38bdf8">0</text> <text x="279.0" y="388" text-anchor="middle" font-size="11" fill="#94a3b8">2024</text> <rect x="315" y="370" width="32" height="0" rx="4" fill="url(#blueGrad)" /> <text x="331.0" y="364" text-anchor="middle" font-size="11" font-weight="600" fill="#38bdf8">0</text> <text x="331.0" y="388" text-anchor="middle" font-size="11" fill="#94a3b8">2025</text> <rect x="367" y="235" width="32" height="135" rx="4" fill="url(#blueGrad)" /> <text x="383.0" y="229" text-anchor="middle" font-size="11" font-weight="600" fill="#38bdf8">46</text> <text x="383.0" y="388" text-anchor="middle" font-size="11" fill="#94a3b8">2026</text>

  <!-- Painel Direito: Macro-Temas -->
  <g transform="translate(465, 172)">
    <rect x="0" y="0" width="405" height="228" rx="8" fill="#111c30" stroke="#1e293b" stroke-width="1" />
    <text x="18" y="26" class="section-title">Distribuição por Macro-Tema</text>
  </g>
  <text x="485" y="245" font-size="11" fill="#cbd5e1" font-weight="500">Ética Médica/Deontologia</text> <rect x="640" y="235" width="150" height="12" rx="3" fill="#1e293b" /> <rect x="640" y="235" width="150" height="12" rx="3" fill="url(#emeraldGrad)" /> <text x="802" y="245" font-size="11" fill="#10b981" font-weight="600">21</text> <text x="485" y="273" font-size="11" fill="#cbd5e1" font-weight="500">Gestão, Infraestrutura/Perícia</text> <rect x="640" y="263" width="150" height="12" rx="3" fill="#1e293b" /> <rect x="640" y="263" width="85" height="12" rx="3" fill="url(#emeraldGrad)" /> <text x="802" y="273" font-size="11" fill="#10b981" font-weight="600">12</text> <text x="485" y="301" font-size="11" fill="#cbd5e1" font-weight="500">Saúde Digital/Tecnologia</text> <rect x="640" y="291" width="150" height="12" rx="3" fill="#1e293b" /> <rect x="640" y="291" width="42" height="12" rx="3" fill="url(#emeraldGrad)" /> <text x="802" y="301" font-size="11" fill="#10b981" font-weight="600">6</text> <text x="485" y="329" font-size="11" fill="#cbd5e1" font-weight="500">Formação/Registro Prof.</text> <rect x="640" y="319" width="150" height="12" rx="3" fill="#1e293b" /> <rect x="640" y="319" width="35" height="12" rx="3" fill="url(#emeraldGrad)" /> <text x="802" y="329" font-size="11" fill="#10b981" font-weight="600">5</text> <text x="485" y="357" font-size="11" fill="#cbd5e1" font-weight="500">Prática Clínica/Procedimentos</text> <rect x="640" y="347" width="150" height="12" rx="3" fill="#1e293b" /> <rect x="640" y="347" width="14" height="12" rx="3" fill="url(#emeraldGrad)" /> <text x="802" y="357" font-size="11" fill="#10b981" font-weight="600">2</text>

  <!-- Rodapé -->
  <g transform="translate(30, 422)">
    <text x="0" y="0" font-size="10" fill="#64748b">⚡ Automação semanal contínua via GitHub Actions • Licença Pública CC-BY 4.0 • md-augustolinhares/cfm-normas</text>
